# Test-only database: never connect the test suite to the production TiDB defaults.
spring.datasource.url=jdbc:h2:mem:dispatch-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=dispatch-local-test-signing-key-not-for-production-1234567890
app.jwt.expiration-ms=3600000
app.media.storage=local
dispatch.elgamal.enabled=false
